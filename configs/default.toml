# Configuracao base. Variaveis PICOCKPIT_* sobrescrevem qualquer valor daqui.
env = "development"
log_level = "INFO"

# log_dir nao e definido de proposito: sem SSD, o padrao aponta para tmpfs
# (XDG_RUNTIME_DIR) e nao gasta escrita do cartao SD. Para guardar em disco,
# defina PICOCKPIT_LOG_DIR ou descomente a linha abaixo.
# log_dir = "logs"

# Provider ativo: simulation | obd | can
provider = "simulation"

# Alvo de UI. So tem significado quando medido no hardware real do Pi 5.
target_fps = 60
sample_interval_ms = 50

database_path = "data/picockpit.db"
theme = "normal"

# Tela cheia sem decoracao. Ligado em producao, desligado em desenvolvimento.
kiosk = false
