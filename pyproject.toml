[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picockpit"
version = "0.1.0"
description = "PiCockpit OS - plataforma automotiva para Raspberry Pi 5"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Andre Heidemann" }]

# Runtime headless (roda no Docker local e no Pi).
# A camada de UI e os drivers de hardware ficam em extras, porque
# o container de backend nao pode depender de Qt nem de SocketCAN.
# O nucleo headless roda apenas com a biblioteca padrao. Dependencias novas
# so entram aqui quando houver uso real, para manter leve o que sobe no Pi.
dependencies = []

[project.optional-dependencies]
ui = [
    # Teto imposto pelo glibc 2.36 do Raspberry Pi OS 12 (Bookworm):
    # wheels aarch64 >= 6.8.1 exigem manylinux_2_39 (glibc >= 2.39).
    # 6.8.0.2 e a ultima manylinux_2_31 e coincide com o ciclo LTS do Qt 6.8.
    "PySide6==6.8.0.2",
]
hardware = [
    "obd>=0.7.2",
    "pyserial>=3.5",
    "python-can>=4.3",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.setuptools.packages.find]
include = ["picockpit*"]

[tool.setuptools.package-data]
# QML acompanha o pacote para que a UI funcione tambem instalada, nao so
# rodando a partir da arvore de fontes.
"picockpit.ui" = ["qml/*.qml", "qml/**/*.qml"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "D"]
# UP042: mantemos `str, Enum` em vez de `StrEnum` para que a camada headless
# continue importavel em interpretadores 3.10, ampliando onde a logica de
# dominio pode ser verificada. Sempre usamos `.value` explicitamente.
ignore = ["D203", "D213", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "hardware: exige hardware real (OBD/CAN/serial) - so roda no Pi",
    "ui: exige sessao grafica Qt - so roda no Pi",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["picockpit"]
